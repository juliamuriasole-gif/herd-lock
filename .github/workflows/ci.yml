name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      - run: pytest -q
      - run: python examples/demo.py
      - run: python -m herdlock --out /tmp/herdlock-results
      - name: check regenerated results match committed results/ (deterministic given the fixed seed)
        run: diff -u /tmp/herdlock-results/summary.json results/summary.json
